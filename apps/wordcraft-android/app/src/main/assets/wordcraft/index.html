<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <script>
    (function() {
      function computeAdaptiveScale() {
        var sw = screen.width || 0;
        var sh = screen.height || 0;
        var w = Math.max(sw, sh);
        var h = Math.min(sw, sh);
        var dpr = window.devicePixelRatio || 1;

        // If screen dimensions are reported in physical hardware pixels (e.g. 2340x1080), normalize to CSS pixels
        if (w > 1800 && dpr > 1.5) {
          w = w / dpr;
          h = h / dpr;
        }

        // Target baseline dimensions for WordCraft desktop interface:
        // Width ~1020px allows the tab strip and Home ribbon groups to lay out cleanly without collision.
        // Height ~475px allows the Backstage menu (464px) to display all items without vertical clipping.
        var targetW = 1020;
        var targetH = 475;
        var scale = 1.0;

        if (h < targetH || w < targetW) {
          var sH = h / targetH;
          var sW = w / targetW;
          scale = Math.min(sH, sW);
          // Clamp scale to minimum 0.68 so text remains sharp and touch targets stay easily reachable
          scale = Math.max(0.68, Math.min(1.0, scale));
        }
        return (Math.round(scale * 100) / 100).toFixed(2);
      }

      var scale = computeAdaptiveScale();
      document.write('<meta name="viewport" content="width=device-width, initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=2.0, user-scalable=yes, viewport-fit=cover">');

      window.addEventListener('resize', function() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          var s = computeAdaptiveScale();
          meta.content = 'width=device-width, initial-scale=' + s + ', minimum-scale=' + s + ', maximum-scale=2.0, user-scalable=yes, viewport-fit=cover';
        }
      });
    })();
  </script>
  <title>WordCraft</title>
  <script>
    (function() {
      var origClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        if (this.href && (this.href.startsWith("blob:") || this.href.startsWith("data:")) && this.download) {
          var downloadName = this.download;
          var href = this.href;
          fetch(href)
            .then(function(r) { return r.blob(); })
            .then(function(b) {
              var reader = new FileReader();
              reader.onloadend = function() {
                if (window.AndroidBlobBridge) {
                  window.AndroidBlobBridge.processBase64Data(reader.result, downloadName, b.type || "");
                }
              };
              reader.readAsDataURL(b);
            })
            .catch(function(e) {
              console.error("Direct download intercept error", e);
            });
          return;
        }
        return origClick.apply(this, arguments);
      };

      function captureAndPrintPdf() {
        var frame = document.getElementById("wordcraft-print-frame");
        if (frame && frame.src && frame.src.startsWith("blob:")) {
          fetch(frame.src)
            .then(function(r) { return r.blob(); })
            .then(function(b) {
              var reader = new FileReader();
              reader.onloadend = function() {
                if (window.AndroidBlobBridge) {
                  window.AndroidBlobBridge.printPdfDocument(reader.result, document.title || "WordCraft Document");
                }
              };
              reader.readAsDataURL(b);
            })
            .catch(function(e) { console.error("Print PDF error", e); });
          return true;
        }
        return false;
      }

      window.print = function() {
        if (!captureAndPrintPdf()) {
          setTimeout(captureAndPrintPdf, 300);
        }
      };

      try {
        var obs = new MutationObserver(function() {
          var frame = document.getElementById("wordcraft-print-frame");
          if (frame && !frame._hooked) {
            frame._hooked = true;
            frame.addEventListener("load", function() {
              setTimeout(captureAndPrintPdf, 200);
            });
          }
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      } catch (err) {}
    })();
  </script>
